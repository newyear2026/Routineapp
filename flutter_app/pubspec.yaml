name: routine_timer
description: 귀여운 감성 루틴 관리 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & 애니메이션
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  
  # 상태 관리
  provider: ^6.1.1
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  
  # 알림
  flutter_local_notifications: ^17.0.0
  
  # 라우팅
  go_router: ^13.0.0
  
  # 유틸리티
  # flutter_localizations가 SDK 버전마다 intl을 고정한다.
  # 여기서 범위를 좁히면 Flutter를 올릴 때마다 해석이 깨진다.
  intl: any
  home_widget: ^0.9.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# 원본 PNG는 손으로 만들지 않는다. BrandMark 위젯에서 렌더링한다.
#   flutter test tool/generate_app_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  # 어댑티브 아이콘은 런처가 마스크를 씌우므로 배경과 전경을 나눠 준다.
  adaptive_icon_background: "#F7F3EE"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # App Store는 알파 채널이 있는 아이콘을 거부한다.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # ARB 기반 다국어 코드 생성 (lib/l10n/*.arb -> AppLocalizations)
  generate: true
  
  # 폰트 (필요시 추가)
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: fonts/Pretendard-Regular.ttf
  #       - asset: fonts/Pretendard-Bold.ttf
  #         weight: 700
