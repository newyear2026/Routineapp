name: routine_timer
description: 귀여운 감성 루틴 관리 앱
publish_to: 'none'
version: 1.0.4+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & 애니메이션
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  
  # 상태 관리
  provider: ^6.1.1
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  
  # 알림
  flutter_local_notifications: ^22.3.0
  routine_notification_platform:
    path: packages/routine_notification_platform
  
  # 라우팅
  go_router: ^13.0.0
  
  # 유틸리티
  # flutter_localizations가 SDK 버전마다 intl을 고정한다.
  # 여기서 범위를 좁히면 Flutter를 올릴 때마다 해석이 깨진다.
  intl: any
  home_widget: ^0.9.3

  # 광고 — 자리·상한은 docs/AD_PLACEMENT.md, 판정은 domain/ads/AdSlotPolicy
  google_mobile_ads: ^6.0.0
  timezone: ^0.11.1

  # 업데이트 안내 — 정책은 application/update/AppUpdates,
  # 실기기 검증 절차는 docs/DEVICE_VALIDATION.md
  #
  # in_app_update는 Play가 설치한 빌드에서만 답한다. 디버그 실행·사이드로드·
  # iOS는 UnavailableUpdatePort로 후퇴하므로 없어도 앱은 그대로 돌아간다.
  in_app_update: ^4.2.5
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1

  # 리뷰 요청 — 정책은 application/review/ReviewPrompt.
  # Play에서 설치한 빌드에서만 창이 뜬다. 디버그 실행·사이드로드에서는 조용히
  # 아무것도 하지 않는다.
  in_app_review: ^2.0.12
  # 캐릭터 팩·번들 판매. 비소모성 상품만 쓰므로 계정 없이 Play 계정으로
  # 복원된다. android 애드온은 환불을 읽는 queryPastPurchases 때문에 필요하다.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0

  # 공용 Firebase 프로젝트 내 LOOPET 앱 — docs/FIREBASE.md
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# 승인된 고양이·시계 원본에서 플랫폼별 아이콘을 생성한다.
#   flutter test tool/generate_app_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  # 어댑티브 아이콘은 런처가 마스크를 씌우므로 배경과 전경을 나눠 준다.
  adaptive_icon_background: "#F7F3EE"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  # App Store는 알파 채널이 있는 아이콘을 거부한다.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # 디렉터리째 올리면 옆에 둔 README·manifest까지 앱에 실린다. 쓰는 그림만 적는다.
  # 그림은 384px로 내보낸다 — 화면에서 가장 큰 자리가 108이고 코드도
  # cacheWidth 384/256으로 디코딩하므로 3x 기기까지 이 크기면 충분하다.
  # 1254px 원본은 design/decorations-src 와 characters/cat_starlight/v1 에 있다.
